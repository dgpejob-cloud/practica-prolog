<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Impresión 3D | Sistema Experto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --accent-color: #f97316;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            overflow: hidden;
            border-top: 5px solid var(--primary-color);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #f9fafb;
            transition: border-color 0.3s ease;
            outline: none;
            cursor: pointer;
        }

        select:focus {
            border-color: var(--primary-color);
        }

        .checkbox-group {
            background: #f9fafb;
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 400;
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        .checkbox-label:hover {
            background-color: #e0f2fe;
        }

        .checkbox-label:last-child {
            margin-bottom: 0;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .btn-diagnosticar {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-diagnosticar:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-diagnosticar:active {
            transform: translateY(0);
        }

        .results-panel {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
            display: none; /* Oculto hasta que haya resultados */
        }

        .results-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .results-content ul {
            margin: 0;
            padding-left: 20px;
        }

        .results-content li {
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .results-content li b {
            color: var(--primary-color);
        }

        /* Animación de carga */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-msg {
            color: #dc2626;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>🖨️ Diagnóstico 3D</h1>
            <p>Sistema Experto Basado en Reglas Lógicas (Prolog)</p>
        </header>
        
        <div class="form-group">
            <label for="material">Material de impresión en uso:</label>
            <select id="material">
                <option value="pla">PLA</option>
                <option value="petg">PETG</option>
                <option value="abs">ABS</option>
                <option value="tpu">TPU</option>
            </select>
        </div>

        <div class="form-group">
            <label>Selecciona los síntomas observados (puedes elegir varios):</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="esquinas_levantadas"> 
                    Despegue de la cama (Warping)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="hilos_visibles_entre_partes"> 
                    Hilos entre piezas (Stringing)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="no_sale_filamento_de_boquilla"> 
                    No sale filamento (Atasco severo)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="primera_capa_despegada"> 
                    Primera capa totalmente despegada
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="impresion_escalonada_o_inclinada"> 
                    Impresión inclinada (Capa desplazada)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="capas_con_agujeros_o_esponjosas"> 
                    Capas con agujeros (Subextrusión)
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="sintoma" value="base_mas_ancha_que_el_modelo"> 
                    Base más ancha de lo normal (Pie de elefante)
                </label>
            </div>
        </div>

        <button class="btn-diagnosticar" onclick="ejecutarConsulta()" id="btn-submit">
            <span id="btn-text">Consultar Motor Prolog</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="results-panel" id="results-panel">
            <div class="results-title">
                🔍 Conclusiones del Sistema:
            </div>
            <div class="results-content" id="conclusion">
                <!-- Aquí se inyectarán las respuestas del servidor -->
            </div>
        </div>
    </div>

    <script>
        async function ejecutarConsulta() {
            const material = document.getElementById('material').value;
            const checkboxes = document.querySelectorAll('input[name="sintoma"]:checked');
            const sintomas = Array.from(checkboxes).map(cb => cb.value);
            
            const resultsPanel = document.getElementById('results-panel');
            const conclusionDiv = document.getElementById('conclusion');
            const btnText = document.getElementById('btn-text');
            const loader = document.getElementById('loader');

            // Limpiar panel
            resultsPanel.style.display = 'block';
            conclusionDiv.innerHTML = '';

            // Validación
            if(sintomas.length === 0) {
                conclusionDiv.innerHTML = "<span class='error-msg'>⚠️ Por favor, selecciona al menos un síntoma de la lista.</span>";
                return;
            }

            // Estado de carga UI
            btnText.innerText = 'Procesando Reglas...';
            loader.style.display = 'block';
            document.getElementById('btn-submit').disabled = true;

            try {
                // Petición al servidor local
                const response = await fetch('/api/consultar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ material: material, sintomas: sintomas })
                });
                
                const data = await response.json();
                
                // Mostrar resultados
                conclusionDiv.innerHTML = data.recomendacion;
            } catch (error) {
                conclusionDiv.innerHTML = "<span class='error-msg'>❌ Error: No se pudo conectar con el motor de inferencia Prolog. Asegúrate de que el servidor esté corriendo.</span>";
            } finally {
                // Restaurar botón
                btnText.innerText = 'Consultar Motor Prolog';
                loader.style.display = 'none';
                document.getElementById('btn-submit').disabled = false;
            }
        }
    </script>
</body>
</html>
