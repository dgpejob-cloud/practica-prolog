<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Impresión 3D</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0fdfa; color: #333; margin: 0; padding: 20px; }
        .app-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        header { margin-bottom: 25px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        header h2 { margin: 0; color: #1e293b; }
        header p { color: #64748b; margin-top: 5px; }
        .form-group { margin-bottom: 25px; }
        .form-select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; background-color: #f8fafc; }
        .sintomas-container { margin-top: 10px; padding: 15px; border: 1px solid #cbd5e1; border-radius: 6px; max-height: 250px; overflow-y: auto; background-color: #f8fafc; }
        .sintomas-container label { display: block; margin-bottom: 12px; cursor: pointer; font-size: 15px; }
        .sintomas-container input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); }
        .btn-consultar { width: 100%; padding: 14px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.2s; }
        .btn-consultar:hover { background-color: #2563eb; }
        .btn-consultar:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .resultados-box { margin-top: 25px; padding: 20px; border-left: 4px solid #ea580c; background-color: #fff7ed; border-radius: 6px; }
        .resultados-box h3 { margin-top: 0; display: flex; align-items: center; color: #1e293b; }
        ul { margin-bottom: 0; padding-left: 20px; }
        li { margin-bottom: 8px; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h2>Diagnóstico de Impresión 3D</h2>
            <p>Sistema Experto Basado en Reglas Lógicas (Prolog)</p>
        </header>

        <div class="form-group">
            <label for="material"><strong>Material de impresión en uso:</strong></label>
            <select id="material" class="form-select">
                <option value="pla">PLA</option>
                <option value="abs">ABS</option>
                <option value="petg">PETG</option>
            </select>
        </div>

        <div class="form-group">
            <label><strong>Selecciona los síntomas observados (puedes elegir varios):</strong></label>
            <div class="sintomas-container">
                <label><input type="checkbox" name="sintoma" value="warping"> Despegue de la cama (Warping)</label>
                <label><input type="checkbox" name="sintoma" value="stringing"> Hilos entre piezas (Stringing)</label>
                <label><input type="checkbox" name="sintoma" value="atasco"> No sale filamento (Atasco severo)</label>
                <label><input type="checkbox" name="sintoma" value="capa_despegada"> Primera capa totalmente despegada</label>
                <label><input type="checkbox" name="sintoma" value="capa_desplazada"> Impresión inclinada (Capa desplazada)</label>
                <label><input type="checkbox" name="sintoma" value="subextrusion"> Capas con agujeros (Subextrusión)</label>
                <label><input type="checkbox" name="sintoma" value="pie_elefante"> Base más ancha de lo normal (Pie de elefante)</label>
            </div>
        </div>

        <button id="btn-submit" class="btn-consultar" onclick="consultarProlog()">Consultar Motor Prolog</button>

        <div class="resultados-box">
            <h3>🔍 Conclusiones del Sistema:</h3>
            <div id="resultado">Esperando los datos de la impresora...</div>
        </div>
    </div>

    <script>
        async function consultarProlog() {
            const boton = document.getElementById('btn-submit');
            const resultadoDiv = document.getElementById('resultado');
            
            // 1. Extraer el material
            const materialSeleccionado = document.getElementById('material').value;
            
            // 2. Extraer los checkboxes marcados
            const checks = document.querySelectorAll('input[name="sintoma"]:checked');
            const sintomasSeleccionados = Array.from(checks).map(cb => cb.value);

            // Validar que al menos haya seleccionado un síntoma
            if (sintomasSeleccionados.length === 0) {
                resultadoDiv.innerHTML = "<p style='color:#dc2626; font-weight:bold;'>Por favor, selecciona al menos un síntoma de la lista.</p>";
                return;
            }

            // Cambiar el estado del botón mientras carga
            boton.innerText = "Consultando...";
            boton.disabled = true;
            resultadoDiv.innerHTML = "Analizando reglas de inferencia en Prolog...";

            // 3. Enviar al servidor Node.js
            try {
                const response = await fetch('/api/consultar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sintomas: sintomasSeleccionados,
                        material: materialSeleccionado
                    })
                });

                const data = await response.json();
                
                // 4. Mostrar el resultado
                resultadoDiv.innerHTML = data.recomendacion;
            } catch (error) {
                resultadoDiv.innerHTML = "<p style='color:#dc2626;'>Hubo un error de conexión con el servidor.</p>";
            } finally {
                // Restaurar el botón
                boton.innerText = "Consultar Motor Prolog";
                boton.disabled = false;
            }
        }
    </script>
</body>
</html>
